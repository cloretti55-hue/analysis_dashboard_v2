name: Update ETF performance data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dashboard-data-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-etf-performance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether recovery run is needed
        id: recovery
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          is_recovery = "${{ github.event.schedule }}" == "30 13 * * 1-5"
          should_run = True
          if is_recovery:
              try:
                  payload = json.loads(Path("data/etf-performance.json").read_text(encoding="utf-8"))
                  instruments = payload.get("instruments", [])
                  generated_today = str(payload.get("generatedAt", ""))[:10] == datetime.now(timezone.utc).date().isoformat()
                  has_refresh_problem = any(
                      item.get("status") == "error" or item.get("stale") is True
                      for item in instruments
                  )
                  should_run = (not generated_today) or has_refresh_problem
              except Exception:
                  should_run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")

      - name: Update ETF performance JSON
        if: steps.recovery.outputs.should_run == 'true'
        run: python scripts/update-etf-performance.py

      - name: Commit updated data
        if: steps.recovery.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf-performance.json data/fixed-income-performance.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update ETF performance data"
            git pull --rebase origin main
            git push
          fi
